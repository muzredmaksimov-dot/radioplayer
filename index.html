<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Радио МИР</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #1a237e, #3949ab);
  color: #fff;
}
.container {
  max-width: 420px;
  margin: auto;
  padding: 20px;
}
h2 {
  margin: 20px 0 10px;
}
button {
  border: none;
  border-radius: 20px;
  padding: 10px 15px;
  cursor: pointer;
}
.play-btn {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: #2196f3;
  color: #fff;
  font-size: 18px;
}
.track {
  background: rgba(255,255,255,0.1);
  padding: 12px;
  border-radius: 16px;
  margin-bottom: 10px;
}
.track-title {
  font-weight: bold;
}
.controls {
  display: flex;
  gap: 10px;
  margin-top: 10px;
}
.like { background: #4caf50; }
.dislike { background: #f44336; }
.preview-btn.playing {
  background: #ff4081;
}
</style>
</head>

<body>
<div class="container">

<h2>РАДИО МИР</h2>

<button class="play-btn" id="streamBtn">▶</button>
<div id="streamStatus">Эфир остановлен</div>

<h2>Новинки эфира</h2>
<div id="tracks"></div>

<audio id="streamAudio"></audio>

</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();

const STREAM_URL = 'https://media1.datacenter.by:1936/radiomir/radiomir/playlist.m3u8';

// ===== ЭФИР =====
const streamAudio = document.getElementById('streamAudio');
let hls;
let streamPlaying = false;

function toggleStream() {
  stopPreview();

  if (!hls) {
    hls = new Hls();
    hls.loadSource(STREAM_URL);
    hls.attachMedia(streamAudio);
  }

  if (streamPlaying) {
    streamAudio.pause();
    streamPlaying = false;
    streamBtn.textContent = '▶';
    streamStatus.textContent = 'Эфир остановлен';
  } else {
    streamAudio.play();
    streamPlaying = true;
    streamBtn.textContent = '⏸';
    streamStatus.textContent = 'Прямой эфир';
  }
}

streamBtn.onclick = toggleStream;

// ===== НОВИНКИ =====
let previewAudio = new Audio();
let currentPreviewId = null;

const userId = tg.initDataUnsafe?.user?.id || 'guest';

// ТЕСТОВЫЕ ДАННЫЕ (потом заменишь на JSON)
const tracks = [
  {
    id: 1,
    artist: 'Lady Gaga',
    title: 'The Dead Dance',
    audio: 'tracks/track1.mp3'
  },
  {
    id: 2,
    artist: 'Klangkarussell',
    title: 'Ride',
    audio: 'tracks/track2.mp3'
  }
];

function stopPreview() {
  previewAudio.pause();
  currentPreviewId = null;
  document.querySelectorAll('.preview-btn').forEach(b => b.classList.remove('playing'));
}

function togglePreview(track) {
  if (streamPlaying) {
    streamAudio.pause();
    streamPlaying = false;
    streamBtn.textContent = '▶';
  }

  if (currentPreviewId === track.id) {
    stopPreview();
    return;
  }

  stopPreview();
  previewAudio.src = track.audio;
  previewAudio.play();
  currentPreviewId = track.id;

  document.querySelector(`[data-id="${track.id}"]`).classList.add('playing');
}

function vote(trackId, value) {
  fetch('votes.csv', {
    method: 'POST',
    body: `${userId},${trackId},${value}\n`
  }).then(() => {
    alert('Голос принят 👍');
  });
}

function renderTracks() {
  const wrap = document.getElementById('tracks');
  wrap.innerHTML = '';

  tracks.forEach(t => {
    wrap.innerHTML += `
      <div class="track">
        <div class="track-title">${t.artist} — ${t.title}</div>
        <div class="controls">
          <button class="preview-btn" data-id="${t.id}" onclick='togglePreview(${JSON.stringify(t)})'>▶</button>
          <button class="like" onclick="vote(${t.id},1)">👍</button>
          <button class="dislike" onclick="vote(${t.id},-1)">👎</button>
        </div>
      </div>
    `;
  });
}

renderTracks();
</script>
</body>
</html>
