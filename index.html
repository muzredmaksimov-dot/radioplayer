<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Радио Мир - Приложение</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- HEADER -->
        <div class="header">
            <h1>🎙️ Радио Мир</h1>
            <button class="admin-btn" onclick="goToAdmin()">Admin</button>
        </div>

        <!-- MAIN CONTENT -->
        <div class="main-content">
            <!-- PLAYER SECTION -->
            <div class="player-section">
                <div class="player-card">
                    <video id="videoPlayer" style="width: 100%; height: 300px; background: #000;"></video>
                    <div class="player-controls">
                        <button id="playBtn" class="control-btn" onclick="togglePlay()">▶️ Включить</button>
                        <button class="control-btn" onclick="goFullscreen()">⛶ Полный экран</button>
                    </div>
                    <div class="player-info">
                        <p>🔴 <span id="status">Готово к трансляции</span></p>
                    </div>
                </div>
            </div>

            <!-- NEWS SECTION -->
            <div class="news-section">
                <h2>📰 Новинки</h2>
                <div id="newsList" class="news-grid">
                    <p style="text-align: center; padding: 20px;">Загрузка новостей...</p>
                </div>
            </div>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <p>© 2026 Радио Мир | Потоковая трансляция HLS</p>
        </div>
    </div>

    <!-- ADMIN PANEL (HIDDEN) -->
    <div id="adminPanel" class="admin-panel hidden">
        <div class="admin-modal">
            <button class="close-btn" onclick="closeAdmin()">✕</button>
            
            <h2>Админ Панель</h2>
            
            <!-- LOGIN -->
            <div id="adminLogin" class="admin-login">
                <input type="password" id="adminPassword" placeholder="Введите пароль администратора" />
                <button onclick="adminLogin()">Вход</button>
            </div>

            <!-- ADMIN INTERFACE -->
            <div id="adminInterface" class="admin-interface hidden">
                <h3>Управление новостями</h3>
                
                <!-- ADD NEWS FORM -->
                <div class="form-section">
                    <h4>Добавить новость</h4>
                    <input type="text" id="newsTitle" placeholder="Заголовок" />
                    <textarea id="newsDesc" placeholder="Описание"></textarea>
                    <input type="text" id="newsImage" placeholder="URL изображения" />
                    <button onclick="addNews()" class="btn-primary">Добавить</button>
                </div>

                <!-- NEWS LIST FOR ADMIN -->
                <div class="form-section">
                    <h4>Существующие новости</h4>
                    <div id="adminNewsList"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
