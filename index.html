<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Радио МИР</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body {
    background: linear-gradient(135deg,#1a237e,#3949ab);
    color:#fff;
    font-family:Segoe UI, sans-serif;
    margin:0;
    padding:20px;
}
.container{max-width:420px;margin:auto}
.card{
    background:rgba(255,255,255,.08);
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
}
.play-btn{
    width:80px;height:80px;border-radius:50%;
    background:#2196f3;border:none;color:#fff;
    font-size:22px;cursor:pointer
}
.vote{
    display:flex;gap:10px;justify-content:center;margin-top:15px
}
.vote button{
    flex:1;padding:12px;border:none;border-radius:12px;
    font-size:16px;cursor:pointer
}
.like{background:#4caf50;color:#fff}
.dislike{background:#f44336;color:#fff}
.disabled{opacity:.5;pointer-events:none}
.track{font-size:18px;font-weight:600;text-align:center}
.artist{opacity:.8;text-align:center;margin-bottom:10px}
.status{text-align:center;font-size:12px;opacity:.7;margin-top:10px}
</style>
</head>

<body>
<div class="container">

<div class="card">
    <div class="track" id="trackTitle">Загрузка эфира…</div>
    <div class="artist" id="trackArtist">Радио МИР</div>

    <div style="text-align:center">
        <button class="play-btn" id="playBtn">▶</button>
    </div>

    <div class="vote">
        <button class="like" id="likeBtn">👍 Нравится</button>
        <button class="dislike" id="dislikeBtn">👎 Не нравится</button>
    </div>

    <div class="status" id="status">Подключение…</div>
</div>

<audio id="audio"></audio>
</div>

<script>
/* Telegram SAFE */
const tg = window.Telegram?.WebApp || null;
if (tg) tg.ready();

/* AUDIO */
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const STREAM = 'https://media1.datacenter.by:1936/radiomir/radiomir/playlist.m3u8';
let hls, playing=false;

/* TRACK STATE */
let currentTrackId = null;

function initPlayer(){
    if(Hls.isSupported()){
        hls=new Hls();
        hls.loadSource(STREAM);
        hls.attachMedia(audio);
    } else {
        audio.src=STREAM;
    }
}

playBtn.onclick=()=>{
    if(!hls && !audio.src) initPlayer();
    if(playing){audio.pause();playBtn.textContent='▶'}
    else{audio.play();playBtn.textContent='⏸'}
    playing=!playing;
};

/* FAKE METADATA (пока) */
function setTrack(title,artist){
    document.getElementById('trackTitle').textContent=title;
    document.getElementById('trackArtist').textContent=artist;
    currentTrackId = btoa(title+artist);
    checkVote();
}
setTrack('Музыкальный эфир','Радио МИР');

/* VOTING */
const likeBtn=document.getElementById('likeBtn');
const dislikeBtn=document.getElementById('dislikeBtn');

function checkVote(){
    const voted = localStorage.getItem('vote_'+currentTrackId);
    if(voted){
        likeBtn.classList.add('disabled');
        dislikeBtn.classList.add('disabled');
        document.getElementById('status').textContent='Вы уже голосовали';
    } else {
        likeBtn.classList.remove('disabled');
        dislikeBtn.classList.remove('disabled');
        document.getElementById('status').textContent='Оцените трек';
    }
}

function saveVote(value){
    localStorage.setItem('vote_'+currentTrackId,value);
    checkVote();
    console.log('VOTE:',currentTrackId,value); // ← сюда потом CSV
}

likeBtn.onclick=()=>saveVote(1);
dislikeBtn.onclick=()=>saveVote(-1);
</script>
</body>
</html>
