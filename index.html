<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>РАДИО МИР | Современное звучание</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root {
  --primary: #8B5CF6;
  --primary-dark: #7C3AED;
  --secondary: #10B981;
  --dark: #111827;
  --light: #F9FAFB;
  --gray: #6B7280;
  --card-bg: rgba(30, 41, 59, 0.8);
  --glass: rgba(255, 255, 255, 0.1);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, var(--dark) 0%, #1E293B 100%);
  color: var(--light);
  min-height: 100vh;
  overflow-x: hidden;
}

.container {
  max-width: 480px;
  margin: 0 auto;
  padding: 20px;
  position: relative;
}

/* Шапка */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  padding-top: 10px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo-icon {
  width: 48px;
  height: 48px;
  background: linear-gradient(135deg, var(--primary), var(--secondary);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  animation: pulse 2s infinite;
}

.logo-text {
  font-size: 24px;
  font-weight: 800;
  background: linear-gradient(135deg, #fff, #E0E7FF);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.status-badge {
  background: var(--glass);
  backdrop-filter: blur(10px);
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 14px;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

/* Карта эфира */
.stream-card {
  background: var(--card-bg);
  backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 30px;
  margin-bottom: 30px;
  border: 1px solid rgba(255, 255, 255, 0.1);
  box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
}

.stream-title {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  font-size: 20px;
  font-weight: 700;
}

.stream-title i {
  color: var(--primary);
}

.stream-controls {
  display: flex;
  align-items: center;
  gap: 24px;
  margin-bottom: 20px;
}

.play-btn {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  border: none;
  color: white;
  font-size: 28px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 10px 20px rgba(139, 92, 246, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
}

.play-btn:hover {
  transform: scale(1.05);
  box-shadow: 0 15px 30px rgba(139, 92, 246, 0.4);
}

.play-btn.playing {
  background: linear-gradient(135deg, #EF4444, #DC2626);
}

.volume-slider {
  flex: 1;
  -webkit-appearance: none;
  height: 6px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 10px;
  outline: none;
}

.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--primary);
  cursor: pointer;
}

.stream-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 14px;
  color: var(--gray);
}

.listeners {
  display: flex;
  align-items: center;
  gap: 8px;
}

/* Секция новинок */
.tracks-section {
  margin-top: 40px;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.section-title {
  font-size: 22px;
  font-weight: 700;
}

.last-update {
  font-size: 12px;
  color: var(--gray);
  opacity: 0.8;
}

.tracks-grid {
  display: grid;
  gap: 16px;
}

.track-card {
  background: var(--glass);
  backdrop-filter: blur(10px);
  border-radius: 16px;
  padding: 20px;
  border: 1px solid rgba(255, 255, 255, 0.05);
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.track-card:hover {
  transform: translateY(-5px);
  border-color: rgba(139, 92, 246, 0.3);
}

.track-card.playing {
  background: rgba(139, 92, 246, 0.15);
  border-color: var(--primary);
}

.track-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 16px;
}

.track-artwork {
  width: 60px;
  height: 60px;
  border-radius: 12px;
  background: linear-gradient(135deg, #6366F1, #8B5CF6);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  color: white;
}

.track-info {
  flex: 1;
}

.track-title {
  font-weight: 700;
  font-size: 16px;
  margin-bottom: 4px;
}

.track-artist {
  color: var(--gray);
  font-size: 14px;
}

.track-controls {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}

.control-btn {
  padding: 10px 20px;
  border-radius: 12px;
  border: none;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
}

.preview-btn {
  background: rgba(255, 255, 255, 0.1);
  color: white;
  flex: 1;
}

.preview-btn.playing {
  background: var(--primary);
}

.like-btn {
  background: rgba(16, 185, 129, 0.2);
  color: #10B981;
  min-width: 70px;
}

.dislike-btn {
  background: rgba(239, 68, 68, 0.2);
  color: #EF4444;
  min-width: 70px;
}

.control-btn:hover {
  transform: translateY(-2px);
}

/* Анимации */
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.7); }
  70% { box-shadow: 0 0 0 10px rgba(139, 92, 246, 0); }
  100% { box-shadow: 0 0 0 0 rgba(139, 92, 246, 0); }
}

@keyframes slideIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.fade-in {
  animation: slideIn 0.5s ease forwards;
}

/* Уведомления */
.notification {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--primary);
  color: white;
  padding: 16px 24px;
  border-radius: 12px;
  font-weight: 600;
  z-index: 1000;
  animation: slideIn 0.3s ease;
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
}

.now-playing-indicator {
  position: absolute;
  top: 10px;
  right: 10px;
  background: var(--primary);
  color: white;
  padding: 4px 8px;
  border-radius: 10px;
  font-size: 10px;
  font-weight: 600;
  animation: pulse 2s infinite;
}

.loader {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(255,255,255,.3);
  border-radius: 50%;
  border-top-color: var(--primary);
  animation: spin 1s ease-in-out infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>

<body>
<div class="container">
  <!-- Шапка -->
  <div class="header">
    <div class="logo">
      <div class="logo-icon">
        <i class="fas fa-broadcast-tower"></i>
      </div>
      <div class="logo-text">РАДИО МИР</div>
    </div>
    <div class="status-badge" id="statusBadge">
      <i class="fas fa-circle"></i> В ЭФИРЕ
    </div>
  </div>

  <!-- Эфир -->
  <div class="stream-card fade-in">
    <div class="stream-title">
      <i class="fas fa-satellite-dish"></i>
      <span>ПРЯМОЙ ЭФИР</span>
    </div>
    
    <div class="stream-controls">
      <button class="play-btn" id="streamBtn">
        <i class="fas fa-play"></i>
      </button>
      <input type="range" min="0" max="100" value="80" class="volume-slider" id="volumeSlider">
    </div>
    
    <div class="stream-info">
      <div id="streamStatus">Слушайте прямо сейчас</div>
      <div class="listeners">
        <i class="fas fa-headphones"></i>
        <span id="listenersCount">1,247 слушают</span>
      </div>
    </div>
  </div>

  <!-- Новинки -->
  <div class="tracks-section" id="tracksSection">
    <div class="section-header">
      <div class="section-title">
        <i class="fas fa-fire"></i> НОВИНКИ ЭФИРА
      </div>
      <div class="last-update" id="lastUpdate">
        Обновлено сегодня
      </div>
    </div>

    <div class="tracks-grid" id="tracksContainer">
      <!-- Треки загружаются здесь -->
    </div>
  </div>

  <audio id="streamAudio"></audio>
</div>

<script>
// Telegram Web App
const tg = window.Telegram.WebApp;
tg.expand();
tg.setHeaderColor('#111827');
tg.setBackgroundColor('#111827');

// Конфигурация
const CONFIG = {
  STREAM_URL: 'https://media1.datacenter.by:1936/radiomir/radiomir/playlist.m3u8',
  TRACKS_API: 'tracks.json',
  VOTES_API: 'votes.php'
};

// Глобальные переменные
let hls = null;
let streamPlaying = false;
let previewAudio = new Audio();
let currentPreviewId = null;
let userId = tg.initDataUnsafe?.user?.id || 'guest_' + Math.random().toString(36).substr(2, 9);

// Инициализация
document.addEventListener('DOMContentLoaded', async () => {
  await loadTracks();
  initStream();
  updateListeners();
  updateTime();
  setInterval(loadTracks, 30000);
});

// Инициализация потока
function initStream() {
  const streamBtn = document.getElementById('streamBtn');
  const volumeSlider = document.getElementById('volumeSlider');
  const streamAudio = document.getElementById('streamAudio');
  
  streamAudio.volume = volumeSlider.value / 100;
  volumeSlider.addEventListener('input', (e) => {
    streamAudio.volume = e.target.value / 100;
    previewAudio.volume = e.target.value / 100;
  });
  
  streamBtn.addEventListener('click', toggleStream);
}

// Управление потоком
async function toggleStream() {
  const streamBtn = document.getElementById('streamBtn');
  const streamStatus = document.getElementById('streamStatus');
  const statusBadge = document.getElementById('statusBadge');
  const streamAudio = document.getElementById('streamAudio');
  
  if (currentPreviewId) {
    stopPreview();
  }
  
  if (!streamPlaying) {
    if (!hls) {
      if (Hls.isSupported()) {
        hls = new Hls();
        hls.loadSource(CONFIG.STREAM_URL);
        hls.attachMedia(streamAudio);
        hls.on(Hls.Events.ERROR, (event, data) => {
          console.error('HLS error:', data);
          showNotification('Ошибка подключения');
        });
      } else if (streamAudio.canPlayType('application/vnd.apple.mpegurl')) {
        streamAudio.src = CONFIG.STREAM_URL;
      }
    }
    
    try {
      await streamAudio.play();
      streamPlaying = true;
      streamBtn.innerHTML = '<i class="fas fa-pause"></i>';
      streamBtn.classList.add('playing');
      streamStatus.textContent = 'Сейчас играет: Прямой эфир';
      statusBadge.innerHTML = '<i class="fas fa-circle" style="color: #10B981"></i> В ЭФИРЕ';
      showNotification('Эфир включен');
    } catch (error) {
      console.error('Playback error:', error);
      showNotification('Ошибка воспроизведения');
    }
  } else {
    streamAudio.pause();
    streamPlaying = false;
    streamBtn.innerHTML = '<i class="fas fa-play"></i>';
    streamBtn.classList.remove('playing');
    streamStatus.textContent = 'Эфир остановлен';
    statusBadge.innerHTML = '<i class="fas fa-circle" style="color: #EF4444"></i> ПАУЗА';
    showNotification('Эфир остановлен');
  }
}

// Загрузка треков
async function loadTracks() {
  try {
    const response = await fetch(CONFIG.TRACKS_API + '?t=' + Date.now());
    const tracks = await response.json();
    
    document.getElementById('lastUpdate').textContent = 
      `Обновлено: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`;
    
    renderTracks(tracks);
  } catch (error) {
    console.error('Error loading tracks:', error);
    renderTracks([]);
  }
}

// Рендеринг треков
function renderTracks(tracks) {
  const container = document.getElementById('tracksContainer');
  
  if (!tracks || tracks.length === 0) {
    container.innerHTML = `
      <div class="track-card fade-in">
        <div class="track-header">
          <div class="track-artwork">
            <i class="fas fa-music"></i>
          </div>
          <div class="track-info">
            <div class="track-title">Треков пока нет</div>
            <div class="track-artist">Администратор добавит их скоро</div>
          </div>
        </div>
        <div class="track-controls">
          <button class="control-btn preview-btn" disabled>
            <i class="fas fa-play"></i> Недоступно
          </button>
          <button class="control-btn like-btn" disabled>
            <i class="fas fa-thumbs-up"></i> 0
          </button>
          <button class="control-btn dislike-btn" disabled>
            <i class="fas fa-thumbs-down"></i> 0
          </button>
        </div>
      </div>
    `;
    return;
  }
  
  let html = '';
  
  tracks.forEach((track, index) => {
    const isPlaying = currentPreviewId === track.id;
    
    html += `
      <div class="track-card fade-in ${isPlaying ? 'playing' : ''}">
        ${isPlaying ? '<div class="now-playing-indicator">СЛУШАЕТЕ</div>' : ''}
        <div class="track-header">
          <div class="track-artwork">
            ${track.artwork || '🎵'}
          </div>
          <div class="track-info">
            <div class="track-title">${track.title || 'Трек'}</div>
            <div class="track-artist">${track.artist || 'Исполнитель'}</div>
          </div>
        </div>
        <div class="track-controls">
          <button class="control-btn preview-btn ${isPlaying ? 'playing' : ''}" 
                  onclick="togglePreview(${JSON.stringify(track).replace(/"/g, '&quot;')})">
            <i class="fas ${isPlaying ? 'fa-stop' : 'fa-play'}"></i>
            ${isPlaying ? 'ОСТАНОВИТЬ' : 'ПРЕСЛУШАТЬ'}
          </button>
          <button class="control-btn like-btn" onclick="vote(${track.id}, 1)">
            <i class="fas fa-thumbs-up"></i>
            <span class="like-count">${track.votes?.likes || 0}</span>
          </button>
          <button class="control-btn dislike-btn" onclick="vote(${track.id}, -1)">
            <i class="fas fa-thumbs-down"></i>
            <span class="dislike-count">${track.votes?.dislikes || 0}</span>
          </button>
        </div>
      </div>
    `;
  });
  
  container.innerHTML = html;
}

// Управление превью
function togglePreview(track) {
  if (streamPlaying) {
    if (confirm('Эфир сейчас играет. Остановить эфир и послушать трек?')) {
      toggleStream();
      setTimeout(() => {
        playPreview(track);
      }, 500);
    }
    return;
  }
  
  if (currentPreviewId === track.id) {
    stopPreview();
    return;
  }
  
  playPreview(track);
}

function playPreview(track) {
  stopPreview();
  
  previewAudio.src = track.audio;
  previewAudio.volume = document.getElementById('volumeSlider').value / 100;
  previewAudio.play();
  currentPreviewId = track.id;
  
  renderTracks(JSON.parse(localStorage.getItem('tracks') || '[]'));
  showNotification(`Слушаем: ${track.artist} - ${track.title}`);
  
  previewAudio.onended = () => {
    stopPreview();
  };
}

function stopPreview() {
  previewAudio.pause();
  previewAudio.currentTime = 0;
  currentPreviewId = null;
  
  const tracks = JSON.parse(localStorage.getItem('tracks') || '[]');
  renderTracks(tracks);
}

// Голосование
async function vote(trackId, value) {
  try {
    const response = await fetch(CONFIG.VOTES_API, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        userId: userId,
        trackId: trackId,
        value: value,
        timestamp: Date.now()
      })
    });
    
    if (response.ok) {
      showNotification(value === 1 ? '👍 Лайк принят!' : '👎 Дизлайк принят!');
      
      const tracks = JSON.parse(localStorage.getItem('tracks') || '[]');
      const trackIndex = tracks.findIndex(t => t.id === trackId);
      
      if (trackIndex !== -1) {
        if (!tracks[trackIndex].votes) {
          tracks[trackIndex].votes = { likes: 0, dislikes: 0 };
        }
        
        if (value === 1) {
          tracks[trackIndex].votes.likes++;
        } else {
          tracks[trackIndex].votes.dislikes++;
        }
        
        localStorage.setItem('tracks', JSON.stringify(tracks));
        renderTracks(tracks);
      }
    }
  } catch (error) {
    console.error('Vote error:', error);
    showNotification('Ошибка при отправке голоса');
  }
}

// Вспомогательные функции
function showNotification(message) {
  const notification = document.createElement('div');
  notification.className = 'notification';
  notification.textContent = message;
  document.body.appendChild(notification);
  
  setTimeout(() => {
    notification.remove();
  }, 3000);
}

function updateListeners() {
  const countElement = document.getElementById('listenersCount');
  const baseListeners = 1247;
  const randomChange = Math.floor(Math.random() * 50) - 25;
  const currentListeners = Math.max(1000, baseListeners + randomChange);
  
  countElement.textContent = `${currentListeners.toLocaleString()} слушают`;
  
  setTimeout(updateListeners, 60000);
}

function updateTime() {
  setTimeout(updateTime, 60000);
}

// Экспортируем функции
window.togglePreview = togglePreview;
window.vote = vote;
</script>
</body>
</html>
